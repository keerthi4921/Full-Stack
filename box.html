
<!DOCTYPE html>
<html lang="en">
<head>
    <title>Page Title</title>

    <style>
        body {
            background-color: rgb(229, 194, 194);
            margin: 0px;
        }

        .First {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(to right, rgb(178, 60, 147), rgb(163, 126, 184), rgb(60, 147, 178));
        }

        .BoxF {
            border-radius: 25px;
            position: absolute;
        }

        .F1 {
            position: absolute;
            width: 30vw;
            height: 10vh;
            display: flex;
            align-items: center;
            justify-content: space-around;
            font-size: large;
            font-weight: bold;
            text-align: center;
        }

        .F1 div {
            color: white;
            text-align: center;
        }

        .F2 {
            width: 86vw;
            height: 65vh;
            left: 10vw;
            top: 17vh;
            background-color: #222;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .F2 img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
        }

        .F3 {
            width: 80vw;
            left: 13vw;
            top: 32vh;
            color: white;
            font-size: 7vw;
            text-align: center;
            text-shadow: 4px 4px 8px rgb(203, 132, 218);
        }
    </style>
</head>

<body>

    <div class="First">

        <div class="F1">
            <div>Home</div>
            <div>Booking</div>
            <div>Contact</div>
            <div>Signup</div>
        </div>

        <div class="F2 BoxF">
            <img src="https://w0.peakpx.com/wallpaper/853/482/HD-wallpaper-beautiful-scenery-mountain-flowers-nature-sky.jpg"
                        alt="Beautiful">
        </div>

        <div class="F3 BoxF">
            Beautiful
        </div>

    </div>

</body>
</html>
